name: Proxy Validation

on:
  pull_request:
    paths:
      - "escalation-proxy/**"
      - "modules/**/*.bicep"
      - "platform/**/*.bicep"
      - "scripts/**/*.ps1"
      - "workload/**/*.bicep"
      - ".github/workflows/proxy-validation.yml"
  push:
    branches: [main]
    paths:
      - "escalation-proxy/**"
      - "modules/**/*.bicep"
      - "platform/**/*.bicep"
      - "scripts/**/*.ps1"
      - "workload/**/*.bicep"
      - ".github/workflows/proxy-validation.yml"

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Bicep sources
        shell: pwsh
        run: |
          $files = @(git ls-files '*.bicep')
          if ($files.Count -eq 0) { throw 'No Bicep sources found.' }
          foreach ($file in $files) {
            az bicep build --file $file --stdout | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Bicep build failed: $file" }
          }
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(git ls-files '*.ps1')
          if ($files.Count -eq 0) { throw 'No PowerShell scripts found.' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object { $_.Message }
              throw "PowerShell parse failed: $file`n$($messages -join "`n")"
            }
          }

  test:
    runs-on: ubuntu-latest
    env:
      PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
      PLATFORM_AGENT_ENDPOINT: http://localhost
      ENTRA_TENANT_ID: test-tenant
      ENTRA_CLIENT_ID: test-client
    defaults:
      run:
        working-directory: escalation-proxy/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify approved package source
        run: |
          test -n "$PIP_INDEX_URL"
          case "$PIP_INDEX_URL" in https://*) ;; *) exit 1;; esac
      - name: Install dependencies
        run: python -m pip install --index-url "$PIP_INDEX_URL" -r requirements-dev.txt
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint proxy
        run: python -m ruff check .
      - name: Type-check extracted modules
        run: python -m mypy
      - name: Scan source for security issues
        run: python -m bandit --quiet --recursive --severity-level medium main.py contracts.py caller_policy.py mcp_transport.py
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Compile proxy modules
        run: python -m compileall -q main.py contracts.py caller_policy.py mcp_transport.py
      - name: Run proxy tests
        run: python -m pytest -q

  image-scan:
    runs-on: ubuntu-latest
    env:
      PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL }}
    defaults:
      run:
        working-directory: escalation-proxy/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify approved package source
        run: |
          test -n "$PIP_INDEX_URL"
          case "$PIP_INDEX_URL" in https://*) ;; *) exit 1;; esac
      - name: Build immutable validation image
        run: docker build --build-arg PIP_INDEX_URL="$PIP_INDEX_URL" --tag sre-escalation-proxy:${{ github.sha }} .
      - name: Report all high and critical vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: sre-escalation-proxy:${{ github.sha }}
          version: v0.65.0
          format: table
          exit-code: "0"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
      - name: Gate fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: sre-escalation-proxy:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-setup-trivy: true