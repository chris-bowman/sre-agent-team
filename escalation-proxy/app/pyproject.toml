[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["authorization.py", "contracts.py", "caller_policy.py", "mcp_transport.py"]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
